name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    # Any Docker-capable Forgejo runner. The job image supplies Python 3.12
    # (ansible-core in requirements-lint.txt needs it), git and make, so no
    # setup-python action (which downloads its builds from GitHub) is needed.
    runs-on: docker
    container:
      image: python:3.12-bookworm

    steps:
    # Plain git instead of actions/checkout: that action needs Node in the job
    # image and an actions mirror. The job token authenticates the fetch, so
    # this also works while the repository is private.
    - name: Checkout repository
      run: |
        git init -q .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c http.extraheader="Authorization: token $TOKEN" \
          fetch -q --depth 1 origin "$GITHUB_SHA"
        git checkout -q FETCH_HEAD
      env:
        TOKEN: ${{ github.token }}

    - name: Install lint tools
      run: python -m pip install -r requirements-lint.txt

    - name: Lint
      run: make lint
