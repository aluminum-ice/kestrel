}.guide pre code{background:none;border:none;padding:0;font-size:.88em;}.guide hr{border:none;border-top:1px solid var(--border);margin:1.5em 0;}.guideindex ol{margin:.3em 0;}.guideindex&gt;ol&gt;li{margin:.55em 0;}.guideindex ul{margin:.2em 0 .7em;}.guidefull{font-size:.92rem;color:var(--muted);}.guidenav{display:flex;justify-content:space-between;gap:1em;margin-top:2em;padding-top:1em;border-top:1px solid var(--border);}.guidenav a{color:var(--link);text-decoration:none;}.guidenav a:hover,.guidenav a:focus{text-decoration:underline;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;a href=&quot;/&quot;&gt;&amp;larr; Dashboard&lt;/a&gt;&lt;/p&gt;&lt;article class=&#x27;guide&#x27;&gt;&lt;h1 id=&quot;kestrel-operator-guide&quot;&gt;Kestrel operator guide&lt;/h1&gt;&lt;p&gt;Kestrel is a headless Wi-Fi handshake-capture device. You reach it over a &lt;em&gt;management link&lt;/em&gt; (a Bluetooth phone tether or your own Wi-Fi), and you drive almost everything from the device&#x27;s built-in web dashboard: enabling and configuring plugins, turning capture on and off, running the learning agent, rebooting and shutting down, backing up and applying updates all happen right there in a browser. The command line (&lt;code&gt;sudo kestrel ...&lt;/code&gt;) is the full-power equivalent: it does everything the dashboard does and also the handful of things the dashboard cannot, such as first boot and SSH, adding a Wi-Fi network, setting the web login mode, and capture tuning and housekeeping. Capture runs on a separate USB Wi-Fi dongle, so management and capture never contend. This guide walks the whole journey: first boot, getting online, the dashboard, capturing, plugins, the learning agent, updates, a command summary, and troubleshooting.&lt;/p&gt;&lt;p&gt;Everything here is configured through two files on the device, but you rarely edit them by hand: &lt;code&gt;/etc/kestrel/config.toml&lt;/code&gt; (capture, web, plugins, the agent) and &lt;code&gt;/etc/default/kestrel&lt;/code&gt; (low-level network plumbing). Prefer the web dashboard, which validates changes and edits a single key at a time; the CLI is the same-strength alternative and reaches the few settings the dashboard does not. The dashboard controls need the dashboard login on (&lt;code&gt;[web] auth&lt;/code&gt;, on by default), which the sections below point out where it matters.&lt;/p&gt;&lt;hr&gt;&lt;nav class=&#x27;guideindex&#x27;&gt;&lt;ol&gt;&lt;li&gt;&lt;a href=&quot;/guide/first-boot-and-logging-in&quot;&gt;First boot and logging in&lt;/a&gt;&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;/guide/first-boot-and-logging-in#stage-the-card-before-first-boot-no-ssh&quot;&gt;Stage the card before first boot (no SSH)&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/first-boot-and-logging-in#log-into-the-dashboard-first&quot;&gt;Log into the dashboard first&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/first-boot-and-logging-in#then-change-the-password&quot;&gt;Then change the password&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/getting-online&quot;&gt;Getting online&lt;/a&gt;&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;/guide/getting-online#adding-a-wi-fi-network&quot;&gt;Adding a Wi-Fi network&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/getting-online#pairing-a-phone-over-bluetooth&quot;&gt;Pairing a phone over Bluetooth&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/the-web-dashboard&quot;&gt;The web dashboard&lt;/a&gt;&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;/guide/the-web-dashboard#login-modes&quot;&gt;Login modes&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/the-web-dashboard#what-you-see&quot;&gt;What you see&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/the-web-dashboard#controls-login-required&quot;&gt;Controls (login required)&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;/guide/the-web-dashboard#advanced-settings&quot;&gt;Advanced settings&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&
