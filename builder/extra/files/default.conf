# kestrel network settings, sourced by the scripts in
# /usr/local/lib/kestrel. Shell KEY=value syntax. Restart the services
# (or reboot) after editing.

# How long the Bluetooth onboarding window stays open, in whole minutes
# (minimum 1). The window opens on every boot until a phone is paired, and also
# closes as soon as a phone pairs.
BT_ONBOARD_MINUTES=10

# BT PAN: seconds to wait for a DHCP address from the phone before using the
# static fallback, and seconds between reconnect attempts.
BT_PAN_DHCP_TIMEOUT=30
BT_PAN_RETRY_SECONDS=30

# Static addresses used only when DHCP gives none, covering the iPhone
# (172.20.10.0/28) and Android (192.168.44.0/24) tethering subnets.
BT_PAN_STATIC_ADDRESSES=172.20.10.14/28,192.168.44.44/24

# DNS servers for the BT PAN link. A tethering phone often routes the Pi's
# traffic over IPv6 while the only resolver it advertises is a link-local IPv6
# address the glibc resolver cannot use, so names fail to resolve even though
# the link works. These routable resolvers are applied to both PAN profiles
# (replacing the unusable auto IPv6 DNS) so lookups succeed over the phone's
# IPv6. Comma-separated; IPv6 and IPv4 may be mixed (IPv4 entries apply only to
# the DHCP profile, which can have an IPv4 gateway). Default is Cloudflare's
# IPv6 resolvers. Leave blank to use only the DNS the phone hands out.
BT_PAN_FALLBACK_DNS=2606:4700:4700::1111,2606:4700:4700::1001

# EXPERIMENTAL, OFF by default, UNTESTED on hardware. A last-ditch reset of the
# Bluetooth controller when a BT PAN link is stuck failing to form (the
# NetworkManager 'bluetooth-failed' loop). When set to "yes", after
# BT_PAN_RESET_AFTER consecutive failed reconnects - and only while no link is
# up and the onboarding window is closed - bt-pan power-cycles the controller to
# clear a wedged host stack. It can DROP a working link if its gating is wrong,
# only helps a wedged controller (not a phone that stopped offering PAN or a
# lost pairing), and has not been validated on hardware. Leave off unless you
# are deliberately bench-testing it.
BT_PAN_STACK_RESET=no
BT_PAN_RESET_AFTER=4

# Wi-Fi band for the built-in chip's station profile: 2.4, 5 or any. 2.4 GHz
# is the default because it works on every board (the Zero 2 W is 2.4 GHz
# only) and avoids mesh routers whose 5 GHz radios refuse the Pi. Used when a
# network is saved; to change the saved network's band run
# `sudo kestrel network wifi --band 5`.
WIFI_BAND=2.4
