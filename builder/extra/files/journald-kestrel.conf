# kestrel: keep the systemd journal across reboots so an overnight
# failure (e.g. the capture service / AngryOxide exiting) is still inspectable
# the next day with `journalctl -u kestrel-capture -b -1`. Storage=persistent
# makes journald create and use /var/log/journal. The size caps keep the journal
# from filling the microSD -- the same disk discipline as the capture run-dir cap.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=50M
SystemMaxFiles=10
